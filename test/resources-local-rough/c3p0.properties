#
# Whitelists for classes instantiated by name during tests.
#
# These live here, and not in resources/c3p0-default.properties, because they name test
# fixtures: whitelisting them for every deployment would widen what c3p0 permits in
# production in order to make our own suite pass. resources-local is on the test classpath
# but is deliberately not published into the c3p0-test jar.
#
# The subkeys differ from the 'c3p0-internal' subkeys used by c3p0-default.properties, which
# is what makes these additive. Whitelists under a common base key are unioned across
# subkeys, so a shadowing key here would replace the library's list rather than extend it.
#
# Without these, the suite cannot be run under
# -Dcom.mchange.v2.reflect.byNameInstantiation.enforceWhitelist=true, which means the
# enforcing configuration -- the one that actually closes the by-name instantiation hole --
# has no regression coverage in its principal consumer.
#

com.mchange.v2.reflect.byNameInstantiation.whitelist.c3p0-test=\
    com.mchange.v2.c3p0.test.fakedriver.FakeDriver,\
    com.mchange.v2.c3p0.test.junit.DriverClassResolutionFailuresJUnitTestCase$ExplodingConstructorDriver,\
    com.mchange.v2.c3p0.test.junit.DriverClassResolutionFailuresJUnitTestCase$NoNoArgConstructorDriver,\
    com.mchange.v2.c3p0.test.junit.DriverClassResolutionFailuresJUnitTestCase$NotADriverAtAll,\
    com.mchange.v2.c3p0.test.junit.DriverClassResolutionFailuresJUnitTestCase$UnregisteredMarkerDriver,\
    com.mchange.v2.c3p0.test.junit.DriverClassResolutionFailuresJUnitTestCase$RegisteredMarkerDriver,\
    com.mchange.v2.c3p0.test.junit.MockDriver,\
    com.mchange.v2.c3p0.test.AlwaysFailConnectionTester,\
    com.mchange.v2.c3p0.test.Percent20FailConnectionTester,\
    com.mchange.v2.c3p0.test.LogCreationTaskRunnerFactory,\
    com.mchange.v2.c3p0.test.ThreadPerTaskRunnerFactory

# Test DataSources reconstructed from References. These were in c3p0-default.properties'
# referenceableJavaBeanClass whitelist, for the same reason and with the same problem.

com.mchange.v2.naming.referenceableJavaBeanClass.whitelist.c3p0-test=\
    com.mchange.v2.c3p0.test.FreezableDriverManagerDataSource,\
    com.mchange.v2.c3p0.test.AlwaysFailDataSource

# Real and deliberately-absent driver classes named by tests. 'no.such.driver.DoesNotExist' is
# whitelisted precisely because it does not exist: the test that names it is exercising the
# class-not-found path, and a whitelist refusal would preempt the failure it means to observe.

com.mchange.v2.reflect.byNameInstantiation.whitelist.c3p0-test-drivers=\
    org.postgresql.Driver,\
    no.such.driver.DoesNotExist
